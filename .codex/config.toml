[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "chrome-devtools-mcp",
    "--headless",
    "--isolated",
    "--no-usage-statistics",
    "--no-performance-crux",
    "--viewport=1440x1000",
]

[mcp_servers.cloudflare-browser]
command = "npx"
args = [
    "mcp-remote",
    "https://browser.mcp.cloudflare.com/mcp",
]

[mcp_servers.cloudflare-dns-analytics]
command = "npx"
args = [
    "mcp-remote",
    "https://dns-analytics.mcp.cloudflare.com/mcp",
]

[mcp_servers.cloudflare-docs]
command = "npx"
args = [
    "mcp-remote",
    "https://docs.mcp.cloudflare.com/mcp",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "@playwright/mcp",
    "--browser=chromium",
    "--headless",
    "--user-data-dir=.playwright-mcp/profile",
    "--output-dir=.playwright-mcp/output",
    "--save-session",
]

[mcp_servers.shadcn]
command = "npx"
args = [
    "shadcn@latest",
    "mcp",
]
