name: Remove outdated labels
on:
  issues:
    types:
      - closed
jobs:
  remove-closed-issue-labels:
    name: Remove closed issue labels
    if: github.event.issue.state == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: mondeja/remove-labels-gh-action@b7118e4ba5dca74acf1059b3cb7660378ff9ab1a # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: |
            dependencies
            javascript
            status:unconfirmed
            status:confirmed
            status:in-progress
            status:blocked
            status:review
            status:done
            prio:critical
            prio:high
            prio:medium
            prio:low
