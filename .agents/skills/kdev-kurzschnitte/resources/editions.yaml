series: Kurzschnitte II
editions:
  - number: 11
    title: These Cuts Go to Eleven
    hint: Some collections stop at ten. This one required an additional setting on the dial.
  - number: 12
    title: Twelve Tabs, No Monkeys
    hint: No time travel was involved in assembling these links, although several seem to have arrived from a less sensible future.
  - number: 13
    title: A Rather Unfortunate Friday
    hint: Against all reasonable advice, I opened the old tabs again. Most survived.
  - number: 14
    title: Fourteen Days Later
    hint: The browser was not entirely deserted, but civilisation had clearly begun to deteriorate.
  - number: 15
    title: Fifteen Minutes into the Future
    hint: Some of these links may become famous. Others have already used most of their allotted time.
  - number: 16
    title: Sixteen Tabs and No Candles
    hint: There will be no cake, no school dance and ideally no public humiliation.
  - number: 17
    title: The Edge of Seventeen Tabs
    hint: Somewhere between youthful optimism and a browser-window crisis, these links accumulated.
  - number: 18
    title: Eighteen, Apparently an Adult
    hint: This edition may now vote, sign contracts and accept responsibility for its own broken links.
  - number: 19
    title: Apollo Nineteen
    hint: The mission was never officially acknowledged, but the launch history remains visible in my browser.
  - number: 20
    title: Twenty Tabs Later
    hint: I left them alone for a moment. They multiplied.
  - number: 21
    title: The House Always Wins
    hint: I counted carefully, watched the pattern and still ended up with more tabs than I started with.
  - number: 22
    title: Catch Twenty-Two Links
    hint: I could close the tabs once I had read them, but reading them required keeping the tabs open.
  - number: 23
    title: Nothing Is a Coincidence
    hint: The number appeared repeatedly. In filenames. In timestamps. In the number of tabs I refused to close.
  - number: 24
    title: Previously, on Kurzschnitte
    hint: Events occur in something close to real time, assuming several months pass between episodes.
  - number: 25
    title: The Twenty-Fifth Hour
    hint: These links were collected during the part of the day that does not officially exist.
  - number: 26
    title: Twenty-Six Letters Later
    hint: From APIs to z-index, the alphabet has once again failed to impose order on the web.
  - number: 27
    title: The Tabs Club
    hint: Several promising links entered this collection at twenty-seven. Unlike certain musicians, they may yet have a future.
  - number: 28
    title: Twenty-Eight Tabs Later
    hint: The infection began with one innocent article and spread rapidly through the browser.
  - number: 29
    title: The Almost-Leap Edition
    hint: This number appears regularly, except when calendars, release schedules or motivation interfere.
  - number: 30
    title: Thirty Tabs of Night
    hint: The browser remained open. Outside, darkness fell. Inside, the unread count continued to rise.
  - number: 31
    title: Thirty-One Flavours of Distraction
    hint: There should be something here for every taste, including several flavours nobody requested.
  - number: 32
    title: Thirty-Two Bit Cinema
    hint: Some of these links may be old enough to require compatibility mode.
  - number: 33
    title: The Thirty-Third Degree
    hint: Advancement through the order requires patience, secrecy and an unreasonable tolerance for CSS.
  - number: 34
    title: No Relevant Results Found
    hint: Contrary to what the internet may suggest, not everything associated with this number belongs in a respectable link collection.
  - number: 35
    title: Thirty-Five Millimetres
    hint: A selection developed from old exposures, forgotten frames and things left too long in the dark.
  - number: 36
    title: Enter the Thirty-Six Chambers
    hint: Each link offers another discipline to master, or at least another tutorial to abandon halfway through.
  - number: 37
    title: The Most Important Number
    hint: Scientists, comedians and people confidently inventing trivia have all reached different conclusions.
  - number: 38
    title: Thirty-Eight Special Effects
    hint: No explosions were required, although several websites attempt the equivalent with JavaScript.
  - number: 39
    title: The Thirty-Nine Steps Between Tabs
    hint: The trail is confusing, the motives are unclear and somebody may be following the referrer headers.
  - number: 40
    title: This Is Forty Tabs
    hint: They are more mature now, but still not organised and increasingly difficult to close.
  - number: 41
    title: One Short of the Answer
    hint: We are close enough to appear knowledgeable, but not close enough to explain anything.
  - number: 42
    title: Mostly Harmless Links
    hint: The answer remains unchanged. The question, as usual, has been misplaced somewhere among the open tabs.
  - number: 43
    title: After the Answer
    hint: Nobody prepared us for what happens once the great question has been settled. Apparently, more links happen.
  - number: 44
    title: Room Forty-Four
    hint: The key was available, the corridor was empty and the browser history insists I had already visited.
  - number: 45
    title: The B-Side
    hint: A collection that spins at its own speed and contains material unlikely to trouble the charts.
  - number: 46
    title: Code Forty-Six
    hint: Access was permitted after several cookies, two consent dialogs and a mildly suspicious identity check.
  - number: 47
    title: The Professional's Reading List
    hint: The suit is immaculate, the assignment is precise and the tabs have been eliminated one by one. Almost.
  - number: 48
    title: Another Forty-Eight Hours
    hint: I intended to finish this within two days. The evidence suggests otherwise.
  - number: 49
    title: Seven by Seven
    hint: A perfectly square edition assembled through an entirely irregular process.
  - number: 50
    title: Fifty First Links
    hint: Each time I return to the browser, it behaves as though we have never reviewed these tabs before.
