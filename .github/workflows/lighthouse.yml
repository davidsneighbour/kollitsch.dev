name: Daily Lighthouse audit

# The schedule below runs every day, but a Lighthouse audit is only useful
# when the site has actually changed since the last one. The job loads
# src/data/lighthouse/history.json from the ci/lighthouse branch, compares
# the current HEAD against the sha recorded by lighthouse-ci.ts on the last
# audit, and skips the rest of the job when they match. A manual
# workflow_dispatch run always audits, regardless of whether HEAD moved.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to audit"
        required: false
        default: "https://kollitsch.dev/"

permissions:
  contents: write

env:
  LIGHTHOUSE_HISTORY_BRANCH: ci/lighthouse
  LIGHTHOUSE_HISTORY_FILE: src/data/lighthouse/history.json

concurrency:
  group: lighthouse-daily
  cancel-in-progress: true

jobs:
  audit:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Lighthouse history branch
        run: |
          set -euo pipefail

          remote_head="refs/heads/${LIGHTHOUSE_HISTORY_BRANCH}"
          remote_tracking="refs/remotes/origin/${LIGHTHOUSE_HISTORY_BRANCH}"
          history_ref="${remote_tracking}:${LIGHTHOUSE_HISTORY_FILE}"
          history_tmp="${RUNNER_TEMP}/lighthouse-history.json"

          if git fetch --no-tags --depth=1 origin "+${remote_head}:${remote_tracking}"; then
          if git show "${history_ref}" >"${history_tmp}"; then
          mv "${history_tmp}" "${LIGHTHOUSE_HISTORY_FILE}"
          echo "Loaded ${LIGHTHOUSE_HISTORY_FILE} from ${LIGHTHOUSE_HISTORY_BRANCH}."
          else
          echo "${LIGHTHOUSE_HISTORY_BRANCH} has no ${LIGHTHOUSE_HISTORY_FILE}; using checked-out file."
          fi
          else
          echo "${LIGHTHOUSE_HISTORY_BRANCH} does not exist yet; using checked-out file."
          fi

      - name: Check for new commits
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "should_run=true" >>"$GITHUB_OUTPUT"
          echo "Manual run -- auditing regardless of HEAD."
          exit 0
          fi

          current_sha=$(git rev-parse --short HEAD)
          last_sha=$(jq -r 'last.sha // empty' "${LIGHTHOUSE_HISTORY_FILE}")

          if [ -z "$last_sha" ] || [ "$last_sha" != "$current_sha" ]; then
          echo "should_run=true" >>"$GITHUB_OUTPUT"
          echo "HEAD is $current_sha, last audited:" \
          "'${last_sha:-none}' -- auditing."
          else
          echo "should_run=false" >>"$GITHUB_OUTPUT"
          echo "HEAD is still $current_sha, already audited -- skipping."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: npm ci

      - name: Run Lighthouse CI
        if: steps.check.outputs.should_run == 'true'
        env:
          LH_URL: ${{ github.event.inputs.url || 'https://kollitsch.dev/' }}
        run: node src/scripts/linting/lighthouse-ci.ts

      - name: Upload JSON reports
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: reports/lighthouse/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit history update
        if: steps.check.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${LIGHTHOUSE_HISTORY_BRANCH}"
          git add "${LIGHTHOUSE_HISTORY_FILE}"
          MSG="chore(lighthouse): update score history [skip ci]"
          if git diff --cached --quiet; then
          echo "No Lighthouse history changes to commit."
          exit 0
          fi
          git commit -m "${MSG}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}"
          REMOTE="${REMOTE}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease "${REMOTE}" "HEAD:${LIGHTHOUSE_HISTORY_BRANCH}"
