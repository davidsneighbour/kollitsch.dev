# @see https://lychee.cli.rs/guides/config/

# DISPLAY
################################################################################
format = "detailed"
mode = "emoji"
no_progress = false
output = ".lychee.report.md"
host_stats = true

# CACHING
################################################################################
cache = true
max_cache_age = "7d"
cache_exclude_status = "500.."

# RUNTIME
################################################################################
threads = 2
max_redirects = 10
max_retries = 2
max_concurrency = 14
default_extension = "md"
index_files = ["index.html"]

# REQUESTS
################################################################################
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36"
timeout = 20
retry_wait_time = 2
accept = ["200", "429"]
insecure = false
scheme = ["https"]
require_https = false
method = "get"
fallback_extensions = ["md", "html"]

# Resolve root-relative links (e.g. /tags/foo/) against the live site.
# Without this, lychee cannot resolve them when checking local markdown files.
base_url = "https://kollitsch.dev"

include_fragments = "anchor-only"
min_tls = "TLSv1_2"

# EXCLUSIONS
################################################################################
skip_missing = false
hidden = true
no_ignore = true
include_verbatim = false
glob_ignore_case = false

exclude = [
  '^https://www\.linkedin\.com',      # blocks bots
  '^https://unsplash\.com',           # blocks bots (401 after redirect)
  '^https://www\.draeger\.com',       # HTTP/2 protocol error (server-side issue)
  '^https://www\.kickstarter\.com',   # blocks bots (403)
  '^https://www\.npmjs\.com',         # blocks bots (403)
  '^https://thebiologist\.rsb\.org\.uk', # blocks bots (403)
  '^https://brandfetch\.com',         # blocks bots (403)
  '^https://www\.facebook\.com',      # blocks bots (400)
  '^https://www\.youtubesummaries\.com', # blocks bots (402 Payment Required)
  # source: src/content/blog/2022/swapping-swap/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://askubuntu\.com/questions/1408784/apps-crash-randomly-on-newly-installed-ubuntu-22-04$',
  # source: src/content/blog/2023/kurzschnitte-ii-1/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://www\.nytimes\.com/2023/08/13/business/zuckerberg-musk-cage-fight\.html$',
  # source: src/content/blog/2024/kurzschnitte-ii-3/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://www\.w3\.org/WAI/business-case/$',
  # source: src/content/blog/2024/switching-from-ubuntu-to-windows-with-wsl/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://sourceforge\.net/projects/ext2fsd/$',
  # source: src/content/blog/2024/kurzschnitte-ii-7/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://arstechnica\.com/security/2024/09/rogue-whois-server-gives-researcher-superpowers-no-one-should-ever-have/$',
  # source: src/content/blog/2024/kurzschnitte-ii-7/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://arstechnica\.com/science/2024/09/meet-the-winners-of-the-2024-ig-nobel-prizes/$',
  # source: src/content/blog/2026/sycophancy-in-the-age-of-ai/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://www\.reuters\.com/article/world/asia-pacific/narendra-modi-appalled-by-temple-built-to-worship-him-idUSKBN0LG0RO/\?utm_source=chatgpt\.com$',
  # source: src/content/blog/2026/sycophancy-in-the-age-of-ai/index.md
  # checker-reason: bot-blocked
  # checked: 2026-09-14
  '^https://www\.reuters\.com/world/us/trump-supporters-see-his-narrow-escape-death-gods-work-2024-07-16/\?utm_source=chatgpt\.com$',
  # source: src/content/blog/2022/simple-multi-language-pre-commit-hooks/index.md
  # reason: unknown
  # checked: 2026-09-14
  '^https://github\.com/danielfdickinson/dfd-template/commit/aecb3a68dfcb7a63492cf79df7c3b58b86f29095$',
  # source: src/content/blog/2023/back-to-top-without-javascript/index.md
  # reason: unknown
  # checked: 2026-09-14
  '^https://github\.com/davidsneighbour/hugo-theme/commit/519ce475cd81488ceafd846eeb5549e4de1dff95$',
  # source: src/content/blog/2023/ping-goes-poof/index.md
  # reason: unknown
  # checked: 2026-09-14
  '^https://github\.com/davidsneighbour/hugo-blockify/releases/tag/v0\.0\.84$',
  # base_url resolves local image references (including @assets/... Astro paths
  # and relative ./file.png paths) as kollitsch.dev URLs; these are verified by
  # the Astro build, not by lychee
  '^https://kollitsch\.dev/.*\.(png|jpg|jpeg|gif|webp|svg|avif|mp4|webm|pdf)$',
  # lychee resolves same-page anchors (#section) against base_url without the
  # page's own path, producing https://kollitsch.dev/#section instead of
  # https://kollitsch.dev/page/#section — exclude these misresolved root fragments
  '^https://kollitsch\.dev/#',
]

exclude_path = [
  "layouts/",
  "CHANGELOG.md",
  "PROJECT.md",
  "TODO.md",
]

extensions = ["md", "txt", "html"]

include = ['gist\.github\.com.*']

exclude_all_private = false
exclude_private = false
exclude_link_local = false
exclude_loopback = false

include_mail = true
include_wikilinks = false

# HOSTS
################################################################################
host_concurrency = 5
host_request_interval = "50ms"
