StylesPath = vale
MinAlertLevel = suggestion # suggestion, warning, error
# Readability stays installed for its opt-in Polysyllables rule (see
# documentation/content/vale.md); it is not part of BasedOnStyles.
Packages = Microsoft, Google, proselint, Readability, write-good, https://github.com/davidsneighbour/vale-config/releases/latest/download/config.zip

Vocab = kollitsch-dev

[*.{md,mdx}]
# alex and Readability are not listed: the DNB package carries copies of
# every alex rule (DNB.Insensitive*) and every Readability metric
# (DNB.Readability*). Listing both reported each finding twice.
BasedOnStyles = Vale, Microsoft, Google, proselint, write-good, AIDetection, Millennialisms, DNB

# Preserve DNB Hugo template patterns and add .astro file-extension ignore.
# The .astro false positive: Vale.Terms flags `astro` in layout file paths.
TokenIgnores = ({{[%<] .* [%>]}}.*?{{[%<] ?/.* [%>]}}),(\[.+\]\({{< .+ >}}\)),[^\S\r\n]({{[%<] \w+ .+ [%>]}})\s,[^\S\r\n]({{[%<](?:/\*) .* (?:\*/)[%>]}})\s,(\S+\.astro)
# Vale.Terms fires on `.astro` file extensions in frontmatter layout paths.
# The term `Astro` (capitalisation) is enforced by Vale.Spelling instead.
Vale.Terms = NO

# Downgraded from error so content-backlog cleanup doesn't need to hand-fix
# every "obvious"/"simply"/"of course" hit alongside the other tone rules.
# Revisit when tightening the rules for new content.
DNB.InsensitiveCondescending = warning

# Duplicates: each rule below reports the same spans as the rule named in
# its comment, which stays active.
DNB.OpenlyReadability = NO # DNB.ReadabilityFleschReadingEase
Google.Acronyms = NO # Microsoft.Acronyms
Google.Contractions = NO # Microsoft.Contractions
Google.Headings = NO # DNB.OpenlyTitles
Google.OxfordComma = NO # Microsoft.OxfordComma
Google.Passive = NO # write-good.Passive
Google.Semicolons = NO # Microsoft.Semicolon
Google.We = NO # Microsoft.We
Google.Will = NO # DNB.OpenlyFutureTense
Microsoft.Headings = NO # DNB.OpenlyTitles
Microsoft.Passive = NO # write-good.Passive
Microsoft.SentenceLength = NO # DNB.OpenlySentenceLength

# Conflicts with British English: these rules require US conventions.
# Punctuation inside quotation marks (British style puts it outside).
Google.Quotes = NO
Microsoft.Quotes = NO
# "July 31, 2016" date order (British style is "31 July 2016").
Google.DateFormat = NO
Microsoft.DateFormat = NO
# American spelling ("colour" -> "color", "-ise" -> "-ize").
Google.Spelling = NO
# Unspaced em dashes (British style uses spaced dashes, see
# documentation/development/markdown-typography.md).
Google.EmDash = NO
Microsoft.Dashes = NO
# A capital letter after a colon in headings (headings use sentence case,
# so the word after a colon stays lowercase).
Microsoft.HeadingColons = NO

# Downgraded from error: these flag deliberate voice choices, not mistakes.
# Expanded forms ("cannot", "did not") are used for emphasis and in quoted
# titles.
Microsoft.Contractions = suggestion
# A paragraph that starts with "But" is a deliberate rhetorical device.
proselint.But = warning
DNB.OpenlyBut = warning
# The pattern has no word boundary: it matches "2st" in "qrcode2stl" and
# flags ordinary ordinals such as "20th anniversary".
Google.Ordinal = suggestion
