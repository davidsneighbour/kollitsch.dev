# see https://docs.astro.build/en/guides/integrations-guide/netlify/
[build]
#command = "npx astro build"
command = ""
publish = "dist"

# 301 redirects to add trailing slashes
[[redirects]]
from = "/:path*"
to = "/:path*/"
status = 301
force = false

[functions]
directory = "src/netlify/functions"

[dev]
command = "npm run dev"
targetPort = 4321
https = { certFile = ".certs/localhost.pem", keyFile = ".certs/localhost-key.pem" }
# optional: keep netlify dev itself on a fixed port
port = 8888
